services:
  antidetect-manager:
    build:
      context: .
      dockerfile: Dockerfile
    image: anti-detect-browser-manager:latest
    container_name: anti-detect-browser-manager
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_PATH: /app/data/adb.sqlite
      CAMOUFOX_IMAGE: camoufox-vnc:latest
      NOVNC_PORT_START: 59080
      NOVNC_PORT_END: 59180
      ADB_BUILD_RUNTIME_IMAGE: ${ADB_BUILD_RUNTIME_IMAGE:-1}
      ADB_RUNTIME_CONTEXT: /app/runtime/camoufox-vnc
    ports:
      - "3000:3000"
    volumes:
      - adb-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  adb-data:
